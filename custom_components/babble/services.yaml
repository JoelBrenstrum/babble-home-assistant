start_nursing:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: babble
    side:
      default: left
      selector:
        select:
          options:
          - left
          - right
    started_at:
      selector:
        datetime: {}
pause_nursing:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: babble
resume_nursing:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: babble
    side:
      selector:
        select:
          options:
          - left
          - right
switch_nursing_side:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: babble
end_nursing:
  fields:
    device_id:
      required: true
